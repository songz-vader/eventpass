<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>EventPass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C1814'/%3E%3Cpath d='M8 11h16v3.2a2.3 2.3 0 0 0 0 4.6V22H8v-3.2a2.3 2.3 0 0 0 0-4.6z' fill='%23B8933A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Mono:wght@400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=3">
<style id="login-fix">
/* Sign-in, register and reset fields sit on a dark card: dark box, light text, light cursor. Kept here as well as in app.css so it always applies. */
.card-dark .field input:not([type=checkbox]):not([type=radio]){background:#26211d;border-color:#4a423b;color:#faf8f4;caret-color:#faf8f4}
.card-dark .field input:not([type=checkbox]):not([type=radio]):focus{border-color:#b8933a}
.card-dark .field input::placeholder{color:#8f8473}
.card-dark .field input:-webkit-autofill,.card-dark .field input:-webkit-autofill:focus{-webkit-text-fill-color:#faf8f4;caret-color:#faf8f4;box-shadow:0 0 0 1000px #26211d inset}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">EventPass needs JavaScript to run. Please turn it on and reload.</p></noscript>
<script type="module" src="/js/main.js"></script>
</body>
</html>
